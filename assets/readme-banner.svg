<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="360" viewBox="0 0 1280 360" role="img" aria-labelledby="title desc">
  <title id="title">TrueLine — Real parts. Clean outlines.</title>
  <desc id="desc">A dark drafting grid with an amber TrueLine wordmark and a cyan technical outline of a mounting plate.</desc>
